name: Gas Station Docker Publish

on:
  workflow_dispatch:
    inputs:
      # Which branch are we publishing the image from?
      releaseType:
        description: 'Branch to publish the image from'
        required: true
        type: choice
        options:
          - '🌱 prerelease (next branch)'
          - '🌳 production (main branch)'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: 3sixty-gas-station-test
  DOCKERFILE_DIR: packages/dlt-iota/deploy/gas-station-test

jobs:
  build-and-push:
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"3sixty","labels":"self-hosted"}') || 'ubuntu-latest' }}

    permissions:
      contents: read
      packages: write

    steps:
      # Set branch variable based on release type
      - name: Set target branch
        id: set-branch
        run: |
          INPUT="${{ github.event.inputs.releaseType }}"
          if [[ "$INPUT" == *"next"* ]]; then
            BRANCH="next"
          elif [[ "$INPUT" == *"main"* ]]; then
            BRANCH="main"
          else
            echo "Error: Unrecognized release type: $INPUT"
            exit 1
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Using branch: $BRANCH"

      # Clone the repository to the runner
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ steps.set-branch.outputs.branch }}

      # Extract the gas station base version from the dockerfile FROM line
      - name: Extract base version from dockerfile
        id: base-version
        run: |
          VERSION=$(grep -m1 '^FROM iotaledger/gas-station:' "$DOCKERFILE_DIR/dockerfile" | cut -d':' -f2)
          if [[ -z "$VERSION" ]]; then
            echo "Error: Could not extract gas station base version from dockerfile"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted base version: $VERSION"

      # Determine Docker tags: latest + gas station base version + datestamp
      - name: Determine Docker tags
        id: docker-tags
        run: |
          # GHCR image names must be lowercase
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${{ env.REGISTRY }}/$OWNER/${{ env.IMAGE_NAME }}"
          DATESTAMP=$(date +%Y%m%d)
          TAGS="$IMAGE:latest,$IMAGE:${{ steps.base-version.outputs.version }},$IMAGE:$DATESTAMP"
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "datestamp=$DATESTAMP" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Docker tags: $TAGS"

      # Ensure QEMU/binfmt is configured for cross-platform builds on self-hosted runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the Docker image
      - name: Build and Push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.DOCKERFILE_DIR }}
          file: ${{ env.DOCKERFILE_DIR }}/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Output publish summary
      - name: Publish Summary
        run: |
          BRANCH="${{ steps.set-branch.outputs.branch }}"
          BASE_VERSION="${{ steps.base-version.outputs.version }}"
          DATESTAMP="${{ steps.docker-tags.outputs.datestamp }}"
          DIGEST="${{ steps.build-push.outputs.digest }}"
          IMAGE="${{ steps.docker-tags.outputs.image }}"
          PACKAGE_URL="${{ github.server_url }}/${{ github.repository }}/pkgs/container/${{ env.IMAGE_NAME }}"

          echo "## Gas Station Docker Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Base version** | \`$BASE_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`$BRANCH\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Datestamp tag** | \`$DATESTAMP\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image digest** | \`$DIGEST\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | [$PACKAGE_URL]($PACKAGE_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`$IMAGE:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$IMAGE:$BASE_VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$IMAGE:$DATESTAMP\`" >> $GITHUB_STEP_SUMMARY
