name: Gas Station Docker Publish

on:
  workflow_dispatch:
    inputs:
      # Which branch are we publishing the image from?
      releaseType:
        description: 'Branch to publish the image from'
        required: true
        type: choice
        options:
          - '🚧 prerelease (next branch)'
          - '🚀 production (main branch)'

env:
  TWIN_DOCKER_USERNAME: ${{ secrets.TWIN_DOCKER_USERNAME }}
  TWIN_DOCKER_REPO: twinfoundation/twin-gas-station-test
  DOCKERFILE_DIR: packages/dlt-iota/deploy/gas-station-test

jobs:
  build-and-push:
    runs-on: ${{ github.event.repository.private && fromJSON('{"group":"twin","labels":"self-hosted"}') || 'ubuntu-latest' }}

    steps:
      # Set branch variable based on release type
      - name: Set target branch
        id: set-branch
        run: |
          INPUT="${{ github.event.inputs.releaseType }}"
          if [[ "$INPUT" == *"next"* ]]; then
            BRANCH="next"
          elif [[ "$INPUT" == *"main"* ]]; then
            BRANCH="main"
          else
            echo "Error: Unrecognized release type: $INPUT"
            exit 1
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Using branch: $BRANCH"

      # Clone the repository to the runner
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ steps.set-branch.outputs.branch }}

      # Extract the gas station base version from the dockerfile FROM line
      - name: Extract base version from dockerfile
        id: base-version
        run: |
          VERSION=$(grep -m1 '^FROM iotaledger/gas-station:' "$DOCKERFILE_DIR/dockerfile" | cut -d':' -f2)
          if [[ -z "$VERSION" ]]; then
            echo "Error: Could not extract gas station base version from dockerfile"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted base version: $VERSION"

      # Determine Docker tags: latest + gas station base version + datestamp
      - name: Determine Docker tags
        id: docker-tags
        run: |
          DATESTAMP=$(date +%Y%m%d)
          TAGS="${{ env.TWIN_DOCKER_REPO }}:latest,${{ env.TWIN_DOCKER_REPO }}:${{ steps.base-version.outputs.version }},${{ env.TWIN_DOCKER_REPO }}:$DATESTAMP"
          echo "datestamp=$DATESTAMP" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "Docker tags: $TAGS"

      # Ensure QEMU/binfmt is configured for cross-platform builds on self-hosted runners
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.TWIN_DOCKER_USERNAME }}
          password: ${{ secrets.TWIN_DOCKER_PASSWORD }}

      # Build and push the Docker image
      - name: Build and Push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.DOCKERFILE_DIR }}
          file: ${{ env.DOCKERFILE_DIR }}/dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}

      # Output publish summary
      - name: Publish Summary
        run: |
          BRANCH="${{ steps.set-branch.outputs.branch }}"
          BASE_VERSION="${{ steps.base-version.outputs.version }}"
          DATESTAMP="${{ steps.docker-tags.outputs.datestamp }}"
          DIGEST="${{ steps.build-push.outputs.digest }}"
          # 'f' is percent-encoded (%66) so GitHub Actions does not redact the org name from the summary
          REPO_BASE_URL="https://hub.docker.com/r/twin%66oundation/twin-gas-station-test"

          echo "## Gas Station Docker Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Base version** | \`$BASE_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`$BRANCH\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Datestamp tag** | \`$DATESTAMP\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image digest** | \`$DIGEST\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [$REPO_BASE_URL?tag=latest]($REPO_BASE_URL?tag=latest)" >> $GITHUB_STEP_SUMMARY
          echo "- [$REPO_BASE_URL?tag=$BASE_VERSION]($REPO_BASE_URL?tag=$BASE_VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- [$REPO_BASE_URL?tag=$DATESTAMP]($REPO_BASE_URL?tag=$DATESTAMP)" >> $GITHUB_STEP_SUMMARY
